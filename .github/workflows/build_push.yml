name: CI

on:
  push:
    branches:
      - main
    paths:
      - '**'
      - '!**.md'
      - '.github/scripts/**'
      - '.github/workflows/build_push.yml'
  # Manual trigger
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_CHUNK_SIZE: 65
  IS_PR_CHECK: false

jobs:
  prepare:
    name: Prepare job
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      latestCommitMessage: ${{ steps.set-env.outputs.LATEST_COMMIT_MESSAGE }}
      matrix: ${{ steps.generate-matrices.outputs.matrix }}
      delete: ${{ steps.generate-matrices.outputs.delete }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set env
        id: set-env
        run: |
          echo "LATEST_COMMIT_MESSAGE<<{delimiter}
          $(git log -1 --pretty=%B)
          {delimiter}" >> $GITHUB_OUTPUT

      - name: Get last successful CI commit
        if: github.event_name != 'workflow_dispatch'
        uses: nrwl/nx-set-shas@v4
        with:
          main-branch-name: ${{ github.ref_name }}
          fallback-sha: 4b825dc642cb6eb9a060e54bf8d69288fbee4904

      - id: generate-matrices
        name: Create output matrices
        env:
          BASE_SHA: ${{ github.event_name == 'workflow_dispatch' && 'all' || env.NX_BASE }}
        run: |
          python ./.github/scripts/generate-build-matrices.py "${BASE_SHA:-all}" Release

  build:
    name: Build extensions (${{ matrix.chunk.number }})
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ toJson(fromJson(needs.prepare.outputs.matrix).chunk) != '[]' }}
    strategy:
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Force unique cache key based on task
        run: echo "build.task=assembleRelease" >> gradle.properties

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Clean up runner gradle.properties
        run: rm -f ~/.gradle/gradle.properties

      - name: Prepare signing key
        if: ${{ env.SIGNING_KEY != '' }}
        run: |
          echo "$SIGNING_KEY" | base64 -d > signingkey.jks

      - name: Build extensions (${{ matrix.chunk.number }})
        env:
          MODULES: ${{ join(matrix.chunk.modules, ' ') }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew $MODULES

      - name: Upload APKs (${{ matrix.chunk.number }})
        uses: actions/upload-artifact@v7
        with:
          name: "individual-apks-${{ matrix.chunk.number }}"
          path: "**/*.apk"
          retention-days: 1

      - name: Clean up CI files
        if: always()
        run: rm -f signingkey.jks

  publish:
    name: Publish extension repo
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v8
        with:
          path: ~/apk-artifacts

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Checkout repo branch
        uses: actions/checkout@v6
        continue-on-error: true
        with:
          ref: repo
          path: temp_repo

      - name: Copy existing repo
        run: |
          if [ -d "temp_repo" ]; then
            mkdir -p repo
            cp -rn temp_repo/* repo/ 2>/dev/null || cp -r temp_repo/* repo/ || true
          fi
          rm -rf temp_repo

      - name: Create repo artifacts
        run: |
          python ./.github/scripts/move-built-apks.py
          
          # Use Keiyoushi inspector
          INSPECTOR_LINK="$(curl -s "https://api.github.com/repos/keiyoushi/extensions-inspector/releases/latest" | jq -r '.assets[0].browser_download_url')"
          curl -L "$INSPECTOR_LINK" -o ./Inspector.jar
          
          # move-built-apks.py script creates a 'repo' folder
          java -jar ./Inspector.jar "repo/apk" "output.json" "tmp"
          
          # Create index
          python ./.github/scripts/create-repo.py
          
          # Copy repository icon
          cp repo_logo.png repo/icon.png
          
          # Create repo.json for Komikku compatibility
          SAMPLE_APK=$(find repo/apk -name "*.apk" | head -n 1)
          if [ -n "$SAMPLE_APK" ]; then
            FINGERPRINT=$(keytool -printcert -jarfile "$SAMPLE_APK" | grep "SHA256:" | head -n 1 | awk -F': ' '{print $2}' | sed 's/://g' | tr '[:upper:]' '[:lower:]')
            REPO_ICON_URL="https://raw.githubusercontent.com/${{ github.repository }}/repo/icon.png"
            echo "{\"meta\":{\"name\":\"bluecxt French Extensions\",\"shortName\":\"BCXT-FR\",\"website\":\"https://github.com/${{ github.repository }}\",\"signingKeyFingerprint\":\"$FINGERPRINT\",\"iconUrl\":\"$REPO_ICON_URL\"}}" > repo/repo.json
            echo "Successfully generated repo.json with icon"
          else
            echo "Warning: No APK found to extract fingerprint!"
          fi

      - name: Deploy to repo branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: repo
          folder: repo
          clean: true
          commit-message: "Update extension repo: ${{ needs.prepare.outputs.latestCommitMessage }}"
